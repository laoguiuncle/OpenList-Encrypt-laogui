# JVM 内存优化
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle 缓存重定向到工程外部（保持工程目录干净）
org.gradle.userHomeDir=G:/laogui/gradle-cache

# AndroidX 配置
android.useAndroidX=true
# Jetifier 已关闭 - 如果构建失败请重新启用
android.enableJetifier=false

# 构建性能优化
# 关闭并行 + 限制 worker 数, 降低与腾讯管家 HIPS 文件扫描的并发冲突(被拦时重试)
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
# 配置缓存与 Flutter/AGP 不兼容，暂时禁用
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn

# 非传递性 R 类（减少 R 类大小）
android.nonTransitiveRClass=true
